# CI Pipeline — lint, test, audit across Linux, macOS, Windows

name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, "feat/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-features

      - name: Test
        run: cargo test --all-features

  # Verify minimum supported Rust version compiles
  msrv:
    name: MSRV (1.89.0)
    runs-on: ubuntu-latest
    env:
      # rust-toolchain.toml pins `stable`, and rustup prefers that file
      # over the toolchain installed below, so without this the job
      # built on stable and proved nothing about the floor.
      RUSTUP_TOOLCHAIN: "1.89.0"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.89.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"

      - name: The MSRV toolchain is the one in use
        run: rustc --version | grep -F 'rustc 1.89.0 '

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --all-features

  # Nightly toolchain tests (optional, continue on error)
  test-nightly:
    name: Test (nightly, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    env:
      # rust-toolchain.toml pins `stable`, and rustup prefers that file
      # over the toolchain installed below, so without this the job
      # ran on stable.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
      - name: The nightly toolchain is the one in use
        run: rustc --version | grep -F -- '-nightly'

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all-features

  # License and advisory audit
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
