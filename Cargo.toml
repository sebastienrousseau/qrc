[package]
authors = ["QRC Contributors"]
categories = ["Algorithms", "Encoding", "Images", "Rendering", "Visualization"]
description = """
A Rust library for generating and manipulating QR code images in various formats
"""
documentation = "https://docs.rs/qrc"
edition = "2021"
exclude = ["/.git/*", "/.github/*", "/.gitignore", "/.vscode/*"]
homepage = "https://qrclib.one"
keywords = ["barcode", "mini-functions", "qr", "qrc", "qrcode"]
license = "MIT OR Apache-2.0"
name = "qrc"
repository = "https://github.com/sebastienrousseau/qrc/"
rust-version = "1.71.1"
version = "0.0.6"
include = [
    "../../LICENSE-APACHE",
    "../../LICENSE-MIT",
    "/benches/**",
    "/build.rs",
    "/Cargo.toml",
    "/examples/**",
    "/README.md",
    "/src/**",
    "/tests/**",
]

[workspace]
members = ["xtask"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
image = { version = "0.25.5", optional = true }

[dependencies.qrcode]
default-features = false
features = ["svg"]
optional = false
version = "0.14.1"

[dev-dependencies]
criterion = "0.5.1"
image = "0.25.5"
rqrr = "0.10.1"

[features]
# `std` gates the `std::error::Error` impl and is required by `raster`.
# `raster` pulls in the `image` crate for RGBA rendering and PNG/JPEG/GIF
# byte encoders plus the legacy image helpers. `svg` and `unicode` are pure
# string renderers with no extra dependencies.
default = ["std", "raster", "svg", "unicode"]
std = []
raster = ["dep:image", "std"]
svg = []
unicode = []

[lib]
path = "src/lib.rs"
name = "qrc"
proc-macro = false
crate-type = ["lib"]
required-features = []

[[bench]]
path = "benches/qrc.rs"
name = "qrc"
harness = false
required-features = []

[profile.dev]
codegen-units = 256
debug = true
debug-assertions = true
incremental = true
lto = false
opt-level = 0
overflow-checks = true
panic = 'unwind'
rpath = false
strip = false

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = "s"
overflow-checks = false
panic = "abort"
rpath = false
strip = "symbols"

[profile.test]
codegen-units = 256
debug = true
debug-assertions = true
incremental = true
lto = false
opt-level = 0
overflow-checks = true
rpath = false
strip = false
