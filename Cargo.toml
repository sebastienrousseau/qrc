[package]
authors = ["QRC"]
categories = ["Algorithms", "Encoding", "Images", "Rendering", "Visualization"]
description = """
A Rust library for generating and manipulating QR code images in various formats
"""
documentation = "https://docs.rs/qrc"
edition = "2021"
autoexamples = false
exclude = ["/.git/*", "/.github/*", "/.gitignore", "/.vscode/*"]
homepage = "https://qrclib.one"
keywords = ["barcode", "mini-functions", "qr", "qrc", "qrcode"]
license = "MIT OR Apache-2.0"
name = "qrc"
repository = "https://github.com/sebastienrousseau/qrc/"
rust-version = "1.75.0"
version = "0.0.6"
include = [
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/benches/**",
    "/Cargo.toml",
    "/examples/**",
    "/README.md",
    "/src/**",
    "/tests/**",
]

[workspace]
members = ["xtask"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
image = "0.25.10"
js-sys = { version = "0.3", optional = true }
miniz_oxide = "0.8.9"
wasm-bindgen = { version = "0.2", optional = true }

[dependencies.qrcode]
default-features = false
features = ["svg"]
optional = false
version = "0.14.1"

[dev-dependencies]
criterion = "0.8.2"

[features]
default = []
wasm = ["wasm-bindgen", "js-sys"]

[lib]
path = "src/lib.rs"
name = "qrc"
proc-macro = false
crate-type = ["lib"]
required-features = []

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "formats"
path = "examples/formats.rs"

[[example]]
name = "colorize"
path = "examples/colorize.rs"

[[example]]
name = "resize"
path = "examples/resize.rs"

[[example]]
name = "watermark"
path = "examples/watermark.rs"

[[example]]
name = "overlay"
path = "examples/overlay.rs"

[[example]]
name = "compress"
path = "examples/compress.rs"

[[example]]
name = "batch"
path = "examples/batch.rs"

[[example]]
name = "combine"
path = "examples/combine.rs"

[[example]]
name = "encoding"
path = "examples/encoding.rs"

[[example]]
name = "dynamic"
path = "examples/dynamic.rs"

[[example]]
name = "multilingual"
path = "examples/multilingual.rs"

[[example]]
name = "macros"
path = "examples/macros.rs"

[[bench]]
path = "benches/qrc.rs"
name = "qrc"
proc-macro = false
harness = false
required-features = []

[profile.dev]
codegen-units = 256
debug = true
debug-assertions = true
incremental = true
lto = false
opt-level = 0
overflow-checks = true
panic = 'unwind'
rpath = false
strip = false

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = "s"
overflow-checks = false
panic = "abort"
rpath = false
strip = "symbols"

[profile.test]
codegen-units = 256
debug = true
debug-assertions = true
incremental = true
lto = false
opt-level = 0
overflow-checks = true
rpath = false
strip = false
