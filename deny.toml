# cargo-deny configuration — v2 format
# https://embarkstudios.github.io/cargo-deny/

[licenses]
# Allow these licenses (SPDX identifiers)
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "NCSA",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
]

# Confidence threshold for license detection from text
confidence-threshold = 0.8

[bans]
# Lint level for duplicate crate versions
multiple-versions = "warn"
highlight = "all"

[advisories]
# paste is unmaintained (RUSTSEC-2024-0436) but it's a transitive dep
# via image -> ravif -> rav1e with no safe upgrade available.
ignore = ["RUSTSEC-2024-0436"]
